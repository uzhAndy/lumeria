services:
  backend:
    build:
      context: . # Builds backend image from dockerfile in the current folder
    container_name: cti-backend # gives name, useful for commands like docker exec
    ports:
      - "8000:8000" # backend can be accessed via http://localhost:8000
    volumes:
      - ./container_data/db.sqlite3:/app/db.sqlite3 # pre-prepared relational db
      - ./container_data/chroma:/app/chroma # pre-prepared embeddings
      - ./container_data/models/flashrank:/app/models/flashrank
      - ./container_data/story_cache:/app/story_cache
    environment:
      - DEBUG=1
      - VECTOR_STORE_DIR=/app/chroma
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    depends_on: # defines startup order
      - neo4j
      - ollama
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]

  frontend:
    build:
      context: ../frontend
    container_name: cti-frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules   # persist node_modules inside Docker such that container keeps its own dependencies
    depends_on:
      - backend # backend must be started before the frontend

  neo4j:
    image: neo4j:5 # pulls official Neo4j image
    container_name: neo4j-mitre-production
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./container_data/neo4j/data:/data # pre-prepared graph store
      - ./container_data/neo4j/logs:/logs
      - ./container_data/neo4j/plugins:/plugins
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_apoc_import_file_use__neo4j__config: 'true'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*'

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama # stores downloaded models and embeddings cache

volumes:
  ollama_data:
